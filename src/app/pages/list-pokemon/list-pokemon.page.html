
<ion-header [translucent]="true">
  <ion-toolbar>
<ion-title>Listado de Pokémon</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <ion-grid>

    @for (pokemon of pokemons(); track pokemon.id) {

      <ion-row
        class="pokemon-fila ion-align-items-center"
        (click)="goToDetail(pokemon)">

        <ion-col size="auto" class="sprite-col">
          @if (pokemon.sprite) {
            <ion-img [src]="pokemon.sprite"></ion-img>
          }
        </ion-col>

        <ion-col class="nombre-col">
          <ion-text class="ion-text-capitalize">
            {{ pokemon.name }}
          </ion-text>
        </ion-col>

        <ion-col size="auto" class="tipos-col">
          <div class="tipos">

            <ion-img
              class="tipo-img"
              [src]="'assets/img/' + pokemon.type1 + '.gif'">
            </ion-img>

            @if (pokemon.type2) {
              <ion-img
                class="tipo-img"
                [src]="'assets/img/' + pokemon.type2 + '.gif'">
              </ion-img>
            }

          </div>
        </ion-col>

      </ion-row>

    }

  </ion-grid>

  <ion-infinite-scroll
    threshold="50px"
    (ionInfinite)="morePokemon($event)">

    <ion-infinite-scroll-content
      loadingText="Cargando Pokémon..."
      loadingSpinner="bubbles">
    </ion-infinite-scroll-content>

  </ion-infinite-scroll>

</ion-content>
